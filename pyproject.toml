[project]
name = "hardware-accelerated-nms-algorithm"
version = "0.1.0"
description = "Hardware-accelerated NMS algorithm: VHDL RTL + Python golden model + dev tooling"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Only needed to save rendered images in explorations/gaussian_splatting/render.py.
render = ["pillow>=10.0"]
# Benchmarks (python -m benchmarks, make bench): the libraries edge pipelines call.
# Optional, so CI (uv sync --all-groups) stays light; tests that need them skip.
bench = [
    "torch>=2.4",
    "torchvision>=0.19",
    "opencv-python-headless>=4.10",
    "matplotlib>=3.8",
]
# The detector load. Ultralytics and its weights are AGPL-3.0; used only as a benchmark load.
# ultralytics-opencv-headless is Ultralytics' own distribution of the same package built on
# opencv-python-headless, so the project has exactly one OpenCV: plain `ultralytics` pulls
# opencv-python, which installs into the same cv2/ folder and breaks the other.
bench-load = ["ultralytics-opencv-headless>=8.3"]
# The live demo (python -m demo, make demo): a Qt window via pyside6-essentials (LGPL-3.0;
# the widgets, without WebEngine and the add-ons) with pyqtgraph plots (MIT); Ultralytics as
# above.
demo = ["ultralytics-opencv-headless>=8.3", "pyside6-essentials>=6.7", "pyqtgraph>=0.13"]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=8.0",
    "ruff>=0.16.4",
]

# torch from the CPU-only index on Linux, so `--extra bench` never pulls the multi-GB CUDA
# build. Its wheels cover both x86_64 (the laptop) and aarch64 (the Pi 5).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
force-exclude = true

extend-exclude = [
    ".vscode",
    "/usr/lib/python3.12",
    ".venv"
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101", "D"]
"*_test.py" = ["S101", "D"]
"tests/**/*.py" = ["S101", "D"]
# Notebooks are exploratory: printing is the point and docstrings are not required.
# The glob must be depth-independent -- golden-model.ipynb lives in models/, not in a
# notebooks/ directory, so the previous "notebooks/**/*.ipynb" never matched anything.
"*.ipynb" = ["T201", "D"]
# CLI entry points exist to print their report; library modules return strings instead.
# host.py is one: it runs as `python -m models.nms.host` and reports to the terminal.
"**/__main__.py" = ["T201"]
"models/nms/host.py" = ["T201"]
# The feasibility scripts are CLI entry points too, reporting to the terminal.
"benchmarks/feasibility/*.py" = ["T201"]
"benchmarks/report.py" = ["T201"]
"benchmarks/onchip_latency.py" = ["T201"]
"demo/audit.py" = ["T201"]

[tool.ruff.lint]
extend-select = [
    "D",    # Pydocstyle – docstring formatting
    "COM",  # Flake8-commas – trailing/comma issues
    "T201", # Flake8-print - print statement
    "ANN", # Flake8-annotations – enforces type annotation style
]

ignore = ["D100", "COM812"]

[tool.ruff.lint.pydocstyle]
convention = "google"
